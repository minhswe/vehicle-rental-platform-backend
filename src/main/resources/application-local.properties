# Local Development Profile - Offline Docker PostgreSQL
spring.application.name=vehicle-rental-platform

# Datasource Configuration for Local Postgres Container
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_rental_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings for Local Iteration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET_KEY}

jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}

# Logging Settings
logging.pattern.level=%5p [traceId:%X{traceId}]

wallet.hold-expiration-minutes=${WALLET_HOLD_EXPIRATION_MINUTES}
