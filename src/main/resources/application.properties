spring.application.name=vehicle-rental-platform

server.tomcat.basedir=.tomcat

# Datasource configuration with local fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_rental_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Application Security & Token Expirations with defaults
jwt.secret=${JWT_SECRET_KEY:c3VwZXItc2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQtMjU2Yml0cw==}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:15m}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:7d}

logging.pattern.level=%5p [traceId:%X{traceId}]

wallet.hold-expiration-minutes=${WALLET_HOLD_EXPIRATION_MINUTES:30}
