spring.application.name=vehicle-rental-platform

server.tomcat.basedir=.tomcat

spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET_KEY}

jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}


logging.pattern.level=%5p [traceId:%X{traceId}]

wallet.hold-expiration-minutes=${WALLET_HOLD_EXPIRATION_MINUTES}




